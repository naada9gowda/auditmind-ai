                  <div className="pb-2 border-b border-slate-200">
                    <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Predictive Compliance Risk & Early-Warning</h1>
                    <p className="text-xs text-slate-500">Transparent 0-10 scoring model combining severity, recurrence history, overdue remediation, and evidence weakness</p>
                  </div>

                  {/* Prominent Disclaimer Notice per Blueprint Section 12 */}
                  <div className="p-4 bg-teal-50 border border-teal-300 rounded-xl text-teal-950 text-xs space-y-1">
                    <div className="font-extrabold uppercase tracking-wide text-[11px] text-teal-900">
                      ⚖️ Hackathon Transparent Scoring Methodology
                    </div>
                    <p className="leading-relaxed">
                      Risk scores are advisory early-warning indicators calculated deterministically based on: <strong>Severity</strong> (High: 3, Med: 2, Low: 1) + <strong>Recurrence across cycles</strong> (0–3 pts) + <strong>Overdue remediation</strong> (0–2 pts) + <strong>Evidence weakness</strong> (0–2 pts). Capped at 10.0. They assist human prioritisation and do not represent formal audit certifications.
                    </p>
                  </div>

                  {/* Ranked Risks Table with Component Decomposition */}
                  <div className="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
                    <div className="p-4 bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-700">
                      Ranked Audit Deficiencies by Risk Priority
                    </div>

                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-[11px] font-semibold text-slate-500 uppercase border-b border-slate-200">
                        <tr>
                          <th className="py-3 px-4">Score / 10</th>
                          <th className="py-3 px-4">Control</th>
                          <th className="py-3 px-4">Defect Narrative</th>
                          <th className="py-3 px-4">Department</th>
                          <th className="py-3 px-4">Transparent Component Scoring Breakdown</th>
                          <th className="py-3 px-4 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {findings.map(f => {
                          const base = f.severity === 'High' ? 3.0 : 2.0;
                          const recur = f.is_recurrence ? 3.0 : 0.0;
                          const overdue = f.id === 'f-101' ? 2.0 : 0.0;
                          const evWeak = f.id === 'f-101' ? 1.1 : 0.5;
                          const total = (base + recur + overdue + evWeak).toFixed(1);

                          return (
                            <tr key={f.id} className="hover:bg-slate-50">
                              <td className="py-3.5 px-4 font-mono font-black text-slate-900">
                                <span className={`px-2.5 py-1 rounded border text-xs ${parseFloat(total) >= 7.0 ? 'bg-rose-50 text-rose-800 border-rose-300' : 'bg-amber-50 text-amber-800 border-amber-300'}`}>
                                  {total} / 10
                                </span>
                              </td>
                              <td className="py-3.5 px-4 font-mono font-bold text-slate-900">{f.control_code}</td>
                              <td className="py-3.5 px-4 font-bold text-slate-900 max-w-sm">{f.description}</td>
                              <td className="py-3.5 px-4 text-slate-600">{f.department}</td>
                              <td className="py-3.5 px-4 text-[11px] text-slate-600">
                                <div className="space-y-0.5 font-mono">
                                  <span>Severity: +{base.toFixed(1)}</span> •{' '}
                                  <span>Recurrence: +{recur.toFixed(1)}</span> •{' '}
                                  <span>Overdue: +{overdue.toFixed(1)}</span> •{' '}
                                  <span>Evidence Gap: +{evWeak.toFixed(1)}</span>
                                </div>
                              </td>
                              <td className="py-3.5 px-4 text-right">
                                <button
                                  onClick={() => { setSelectedFinding(f); setActiveTab('findings'); }}
                                  className="text-xs font-bold text-teal-600 hover:underline"
                                >
                                  Inspect Finding →
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB 8: AUDIT HISTORY TIMELINE */}
              {activeTab === 'history' && (
                <div className="space-y-6 animate-fade-in">
                  <div className="pb-2 border-b border-slate-200 flex justify-between items-center">
                    <div>
                      <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Audit History Timeline</h1>
                      <p className="text-xs text-slate-500">Chronological organizational memory across audit cycles (Jan 2026, Apr 2026, Jul 2026)</p>
                    </div>
                  </div>

                  {/* Selector */}
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center gap-3 text-xs">
                    <span className="font-bold text-slate-700">Select Control Timeline:</span>
                    <select
                      value={selectedTimelineCode}
                      onChange={(e) => setSelectedTimelineCode(e.target.value)}
                      className="rounded-lg border border-slate-300 py-1.5 px-3 text-xs bg-white font-bold"
                    >
                      <option value="SEC-014">SEC-014: Employee Access Reviews (3-Cycle Recurrence Chain)</option>
                      <option value="SEC-013">SEC-013: Vulnerability Management</option>
                      <option value="SEC-003">SEC-003: Cryptographic Controls</option>
                    </select>
                  </div>

                  {/* Vertical Timeline */}
                  <div className="bg-white rounded-xl border border-slate-200 shadow-xs p-8">
                    <div className="relative pl-8 border-l-2 border-slate-200 ml-4 space-y-8">
                      {TIMELINE_EVENTS.map((ev, i) => {
                        const isCycle = ev.event_type === 'audit_cycle';
                        const isRecur = ev.summary.includes('Recurrence') || ev.summary.includes('Recurring');
                        const isRem = ev.event_type === 'remediation';

                        return (
                          <div key={i} className="relative">
                            <div className={`absolute -left-[45px] top-1.5 w-8 h-8 rounded-full flex items-center justify-center text-xs text-white font-bold shadow-md ${isCycle ? 'bg-blue-600 ring-4 ring-blue-100' : isRecur ? 'bg-amber-500 ring-4 ring-amber-100' : isRem ? 'bg-purple-600 ring-4 ring-purple-100' : 'bg-rose-600 ring-4 ring-rose-100'}`}>
                              {isCycle ? '📅' : isRecur ? '⚠️' : isRem ? '🔧' : '•'}
                            </div>

                            <div className={`p-4 rounded-xl border space-y-1.5 ${isRecur ? 'bg-amber-50/50 border-amber-300' : isCycle ? 'bg-blue-50/30 border-blue-200' : 'bg-slate-50 border-slate-200'}`}>
                              <div className="flex justify-between items-center text-xs">
                                <span className="font-bold text-slate-900 text-sm">{ev.summary}</span>
                                <span className="font-mono text-slate-500 font-semibold">{ev.event_date}</span>
                              </div>
                              <p className="text-xs text-slate-700 leading-relaxed">{ev.detail}</p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 9: AI AUDIT ASSISTANT (WITH HINDSIGHT VS BASELINE COMPARISON) */}
              {activeTab === 'assistant' && (
                <div className="flex flex-col h-[calc(100vh-13rem)] space-y-4 animate-fade-in">
                  <div className="pb-2 border-b border-slate-200 flex flex-wrap justify-between items-center gap-3">
                    <div>
                      <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                        <span>💬</span> AI Audit Assistant
                      </h1>
                      <p className="text-xs text-slate-500">Grounded compliance intelligence recalling cross-cycle memory with verifiable source citations</p>
                    </div>

                    {/* HINDSIGHT DEMO SWITCH: BASELINE VS HINDSIGHT (SECTION 5 DEMO PAYOFF) */}
                    <div className="flex items-center gap-3 bg-white p-1.5 rounded-xl border border-slate-200 text-xs">
                      <span className="font-bold text-slate-500 text-[11px] ml-1">Demo Mode:</span>
                      <button
                        onClick={() => {
                          setHindsightDemoMode('with_memory');
                          showToast('Switched to Hindsight-Powered Agent with memory.', 'info');
                        }}
                        className={`px-3 py-1 rounded-lg font-bold text-xs transition ${hindsightDemoMode === 'with_memory' ? 'bg-teal-600 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`}
                      >
                        🧠 Hindsight Memory ON
                      </button>
                      <button
                        onClick={() => {
                          setHindsightDemoMode('baseline_no_memory');
                          showToast('Switched to Baseline Agent (Stateless / No Memory).', 'info');
                        }}
                        className={`px-3 py-1 rounded-lg font-bold text-xs transition ${hindsightDemoMode === 'baseline_no_memory' ? 'bg-slate-800 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`}
                      >
                        Stateless Baseline
                      </button>
                    </div>
                  </div>

                  {/* Starter Prompts */}
                  <div className="flex items-center gap-2 text-xs flex-wrap">
                    <span className="text-slate-400 font-bold uppercase text-[10px]">Starter Queries:</span>
                    {[
                      'Has SEC-014 been a problem before?',
                      'What are the highest risk findings?',
                      'Any overdue actions?',
                      'What happened last time in IT Operations?'
                    ].map(q => (
                      <button
                        key={q}
                        onClick={() => handleChatSubmit(q)}
                        className="px-3 py-1 bg-white hover:bg-teal-50 border border-slate-200 text-slate-700 hover:text-teal-900 rounded-full font-medium shadow-2xs text-xs"
                      >
                        {q}
                      </button>
                    ))}
                  </div>

                  {/* Chat message history */}
                  <div className="flex-1 bg-white rounded-xl border border-slate-200 p-5 overflow-y-auto space-y-4 shadow-xs">
                    {chatMessages.map(m => (
                      <div key={m.id} className={`flex gap-3 max-w-3xl ${m.sender === 'user' ? 'ml-auto flex-row-reverse' : 'mr-auto'}`}>
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs text-white shrink-0 ${m.sender === 'user' ? 'bg-slate-900' : 'bg-teal-600 shadow-md shadow-teal-600/30'}`}>
                          {m.sender === 'user' ? 'You' : 'AI'}
                        </div>

                        <div className="space-y-2">
                          <div className={`p-4 rounded-2xl text-xs leading-relaxed whitespace-pre-wrap ${m.sender === 'user' ? 'bg-slate-900 text-white rounded-tr-none' : 'bg-slate-50 border border-slate-200 text-slate-800 rounded-tl-none'}`}>
                            {m.text}
                          </div>

                          {m.references && m.references.length > 0 && (
                            <div className="flex gap-2 flex-wrap pt-1">
                              {m.references.map((r, i) => (
                                <button
                                  key={i}
                                  onClick={() => openDrawer(r.doc, r.page, r.excerpt, r.label)}
                                  className="text-[11px] font-bold bg-teal-50 hover:bg-teal-100 text-teal-900 border border-teal-300 px-2.5 py-1 rounded-lg flex items-center gap-1 shadow-2xs"
                                >
                                  📄 {r.label}
                                </button>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Input form */}
                  <form onSubmit={(e) => { e.preventDefault(); handleChatSubmit(); }} className="flex gap-2">
                    <input
                      type="text"
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      placeholder="Ask Audit Assistant with historical memory..."
                      className="flex-1 rounded-xl border border-slate-300 px-4 py-2.5 text-xs bg-white focus:ring-2 focus:ring-teal-500 shadow-xs"
                    />
                    <button type="submit" className="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs rounded-xl shadow-xs">
                      Send
                    </button>
                  </form>
                </div>
              )}

              {/* TAB 10: HINDSIGHT MEMORY EXPLORER (SECTION 8 RECOMMENDED DEMO SCREEN!) */}
              {activeTab === 'memory' && (
                <div className="space-y-6 animate-fade-in">
                  <div className="pb-2 border-b border-slate-200 flex justify-between items-center">
                    <div>
                      <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                        <span>🧠</span> Hindsight Memory Explorer
                      </h1>
                      <p className="text-xs text-slate-500">Live inspection of retained audit memories, reflections, and cross-cycle organizational recall</p>
                    </div>
                    <span className="text-xs font-mono font-bold bg-teal-50 text-teal-800 px-3 py-1 rounded-lg border border-teal-300">
                      Bank: abctech-audit-memory ({memories.length} memories retained)
                    </span>
                  </div>

                  {/* Retain, Recall, Reflect Architecture Overview */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                    <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-xs space-y-1">
                      <div className="font-extrabold text-teal-800 uppercase text-[11px] flex items-center gap-1.5">
                        <span>📥</span> Hindsight Retain
                      </div>
                      <p className="text-slate-600 leading-relaxed">
                        Stores approved findings, remediation outcomes, and policy changes with rich metadata tags (organisation_id, control_id, department, audit_period).
                      </p>
                    </div>

                    <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-xs space-y-1">
                      <div className="font-extrabold text-blue-800 uppercase text-[11px] flex items-center gap-1.5">
                        <span>🔍</span> Hindsight Recall
                      </div>
                      <p className="text-slate-600 leading-relaxed">
                        When a new finding or question arises, recalls past audit memories matching control ID, department, or issue context across prior cycles.
                      </p>
                    </div>

                    <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-xs space-y-1">
                      <div className="font-extrabold text-purple-800 uppercase text-[11px] flex items-center gap-1.5">
                        <span>💡</span> Hindsight Reflect
                      </div>
                      <p className="text-slate-600 leading-relaxed">
                        Synthesizes retrieved history to detect recurring patterns and advise human reviewers whether an issue was truly resolved or merely patched.
                      </p>
                    </div>
                  </div>

                  {/* Search and Recall Simulation in Memory Explorer */}
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs space-y-3">
                    <div className="flex flex-wrap items-center gap-3 text-xs">
                      <span className="font-bold text-slate-700 whitespace-nowrap">🔍 Search & Test Recall:</span>
                      <input
                        type="text"
                        value={memorySearchQuery}
                        onChange={(e) => setMemorySearchQuery(e.target.value)}
                        placeholder="Filter by keyword (e.g. SEC-014, IT Operations, spreadsheet, recurrence)..."
                        className="flex-1 min-w-[200px] rounded-lg border border-slate-300 px-3 py-1.5 text-xs bg-slate-50 focus:bg-white focus:ring-1 focus:ring-teal-500"
                      />
                      {memorySearchQuery && (
                        <button onClick={() => setMemorySearchQuery('')} className="text-xs text-rose-600 hover:text-rose-800 font-bold cursor-pointer">
                          Clear
                        </button>
                      )}
                    </div>

                    <div className="flex items-center gap-2 text-xs flex-wrap">
                      <span className="text-[10px] uppercase font-bold text-slate-400">Recall Presets:</span>
                      {['SEC-014 Recurrence', 'IT Operations', 'Access Review', 'Spreadsheet Patch'].map(term => (
                        <button
                          key={term}
                          onClick={() => setMemorySearchQuery(term)}
                          className="px-2.5 py-0.5 rounded-full bg-slate-100 hover:bg-teal-50 hover:text-teal-900 border border-slate-200 text-slate-600 text-[11px] font-medium cursor-pointer"
                        >
                          {term}
                        </button>
                      ))}
                      {memorySearchQuery && (
                        <button
                          onClick={() => setMemorySearchQuery('')}
                          className="px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 text-[11px] font-bold cursor-pointer"
                        >
                          Reset
                        </button>
                      )}
                    </div>
                  </div>

                  {/* Retained Memories List */}
                  <div className="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
                    <div className="p-4 bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-700 flex justify-between">
                      <span>Retained Memory Records ({memories.filter(m => !memorySearchQuery || m.summary.toLowerCase().includes(memorySearchQuery.toLowerCase()) || m.narrative.toLowerCase().includes(memorySearchQuery.toLowerCase()) || m.control_id.toLowerCase().includes(memorySearchQuery.toLowerCase()) || m.department.toLowerCase().includes(memorySearchQuery.toLowerCase())).length})</span>
                      <span className="text-[11px] text-slate-400">Isolated to tenant ABC Technologies</span>
                    </div>

                    <div className="divide-y divide-slate-100">
                      {memories
                        .filter(m => !memorySearchQuery || m.summary.toLowerCase().includes(memorySearchQuery.toLowerCase()) || m.narrative.toLowerCase().includes(memorySearchQuery.toLowerCase()) || m.control_id.toLowerCase().includes(memorySearchQuery.toLowerCase()) || m.department.toLowerCase().includes(memorySearchQuery.toLowerCase()))
                        .map(mem => (
                        <div key={mem.id} className="p-5 hover:bg-slate-50 transition space-y-2">
                          <div className="flex flex-wrap justify-between items-center gap-2">
                            <div className="flex items-center gap-2">
                              <span className="font-mono text-xs font-bold bg-slate-900 text-white px-2 py-0.5 rounded">
                                {mem.control_id}
                              </span>
                              <span className="text-xs font-bold text-slate-900">{mem.summary}</span>
                              <span className="text-[10px] uppercase font-bold text-teal-800 bg-teal-50 px-2 py-0.5 rounded border border-teal-200">
                                {mem.category}
                              </span>
                            </div>
                            <span className="text-[11px] font-mono text-slate-500 font-semibold">{mem.audit_period}</span>
                          </div>

                          <p className="text-xs text-slate-700 leading-relaxed font-medium">
                            {mem.narrative}
                          </p>

                          <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-[11px] space-y-1">
                            <div className="text-purple-900 font-bold">Reflected Context:</div>
                            <div className="text-slate-600 italic">"{mem.reflection}"</div>
                            <div className="text-slate-400 pt-1 font-mono">Source Reference: {mem.source_ref}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* APPROVE FINDING CONFIRMATION MODAL */}
          {approveModalOpen && selectedFinding && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 animate-fade-in border border-slate-200">
                <div className="flex items-center gap-2.5 text-slate-900 font-extrabold text-base">
                  <span className="text-teal-600 text-xl">🛡️</span>
                  <span>Confirm Finding Approval</span>
                </div>

                <p className="text-xs text-slate-600 leading-relaxed">
                  Approving finding <strong>#{selectedFinding.id}</strong> ({selectedFinding.control_code}) will:
                </p>

                <ul className="text-xs text-slate-700 space-y-1.5 list-disc pl-5">
                  <li>Promote from <strong>Draft AI Suggestion</strong> to <strong>Approved Authoritative Record</strong>.</li>
                  <li>Write an immutable entry into <code className="font-mono text-slate-900">status_history</code> table.</li>
                  <li>Trigger <strong>Hindsight Retain</strong> to preserve this audit context in the organisation memory bank.</li>
                  <li>Scan prior cycles for recurring weaknesses.</li>
                </ul>

                <div className="pt-3 border-t border-slate-100 flex justify-end gap-2 text-xs">
                  <button
                    onClick={() => setApproveModalOpen(false)}
                    className="px-4 py-2 rounded-lg border border-slate-300 font-bold text-slate-700 hover:bg-slate-50"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => handleApproveFinding(selectedFinding.id)}
                    className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 font-bold text-white shadow-xs"
                  >
                    Confirm & Approve
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SOURCE DRAWER (SLIDE-OVER FROM RIGHT) */}
          {sourceDrawer.isOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex justify-end animate-fade-in">
              <div className="w-full max-w-lg bg-white h-full shadow-2xl flex flex-col border-l border-slate-200 animate-slide-right">
                <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                  <div>
                    <h3 className="font-bold text-sm">Source Document Evidence Viewer</h3>
                    <p className="text-xs text-slate-400">{sourceDrawer.doc} • Page {sourceDrawer.page}</p>
                  </div>
                  <button
                    onClick={() => setSourceDrawer({ ...sourceDrawer, isOpen: false })}
                    className="text-slate-400 hover:text-white text-lg font-bold p-1 rounded"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 space-y-5 overflow-y-auto flex-1 bg-slate-50/50">
                  <div className="bg-teal-50 border-2 border-teal-500/40 p-4 rounded-xl space-y-1">
                    <span className="text-[10px] font-bold text-teal-800 uppercase block">Extracted Cited Excerpt</span>
                    <blockquote className="text-xs font-semibold text-slate-800 italic border-l-4 border-teal-600 pl-3 py-1 bg-white rounded">
                      "{sourceDrawer.excerpt}"
                    </blockquote>
                  </div>

                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-2xs space-y-2">
                    <div className="flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase">
                      <span>PyMuPDF Extracted Raw Page Content</span>
                      <span>Page {sourceDrawer.page}</span>
                    </div>

                    <div className="font-mono text-xs text-slate-700 leading-relaxed whitespace-pre-wrap bg-slate-50 p-4 rounded-lg border border-slate-100">
{`============================================================
ABC TECHNOLOGIES — INTERNAL AUDIT ASSURANCE REPORT (2026)
SECTION: 4.1 ACCESS MANAGEMENT & CONTROL TESTING
CONTROL CODE: ${sourceDrawer.controlCode || 'SEC-014'}
============================================================

Auditor Observations:
${sourceDrawer.excerpt}

Audit Testing Steps:
1. Inspected quarterly user access review spreadsheets provided by IT Operations.
2. Verified manager sign-off signatures for privileged AWS IAM and database access roles.
3. Cross-referenced human resource leavers list against active user directories.

Findings Summary:
- Timely quarterly access review SLA was missed by >45 days.
- 3 terminated contractors retained active VPN profile markers.
- Prior corrective action REM-2026-014-01 was only partially effective.

Classification: High Severity Defect (Recurrence Pattern Identified)`}
                    </div>
                  </div>

                  <div className="text-[11px] text-slate-500 bg-slate-100 p-3 rounded-lg">
                    🔒 Untrusted Input Notice: Document text is extracted safely via PyMuPDF and presented verbatim for human auditor verification.
                  </div>
                </div>

                <div className="p-4 border-t border-slate-200 bg-white flex justify-end">
                  <button
                    onClick={() => setSourceDrawer({ ...sourceDrawer, isOpen: false })}
                    className="px-4 py-2 border border-slate-300 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-50"
                  >
                    Close Viewer
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
